  <text x="110" y="187" font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-size="14" font-weight="900" fill="#1e1b4b" text-anchor="middle">تواصل معنا الآن 💬</text>

  <!-- Right Classic 5-Point Star Graphic -->
  <g transform="translate(510, 130)">
    <circle cx="0" cy="0" r="38" fill="#38bdf8" opacity="0.2"/>
    <polygon points="0,-22 5.2,-7.1 20.9,-6.7 8.3,5.8 12.9,17.8 0,8.8 -12.9,17.8 -8.3,5.8 -20.9,-6.7 -5.2,-7.1" fill="#fbbf24"/>
  </g>
