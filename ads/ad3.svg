  <!-- Subtitle -->
  <text x="30" y="132" font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-size="15" font-weight="700" fill="#c7d2fe">تواصل معنا عبر الاتصال أو الواتساب لأي استفسار</text>

  <!-- Action Button -->
