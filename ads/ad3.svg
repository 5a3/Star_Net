      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="260" rx="20" fill="url(#bgStar3)"/>
  <path d="M0,160 C150,230 350,110 600,180 L600,260 L0,260 Z" fill="#6366f1" opacity="0.3"/>

  <!-- Badge -->
  <rect x="30" y="22" width="160" height="32" rx="16" fill="#ffffff" opacity="0.2"/>
  <text x="110" y="43" font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">🎧 الدعم الفني 24/7</text>
  
  <!-- Main Title -->
