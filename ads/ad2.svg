<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260">
  <defs>
    <linearGradient id="bgStar2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
  </defs>
  <rect width="600" height="260" rx="20" fill="url(#bgStar2)"/>
  <circle cx="510" cy="130" r="85" fill="#38bdf8" opacity="0.12"/>

  <!-- Badge -->
  <rect x="30" y="22" width="150" height="32" rx="16" fill="#38bdf8" opacity="0.25"/>
  <text x="105" y="43" font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">🎁 عروض كروت ستار</text>
  
  <!-- Main Title -->
  <text x="30" y="96" font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-size="26" font-weight="900" fill="#ffffff">أقوى الباقات لكافة الاستخدامات</text>
  
  <!-- Subtitle -->
  <text x="30" y="132" font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-size="15" font-weight="700" fill="#e0e7ff">رصيد مضاعف وصلاحيات أطول مع شبكة ستار نت</text>

  <!-- Action Button -->
  <rect x="30" y="162" width="180" height="40" rx="20" fill="#4f46e5" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="120" y="187" font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">استعرض نقاط البيع 📍</text>

  <!-- Right Classic Card & 5-point Star Graphic -->
  <g transform="translate(510, 130)">
    <rect x="-35" y="-24" width="70" height="48" rx="10" fill="#ffffff" opacity="0.15" stroke="#fbbf24" stroke-width="2"/>
    <polygon points="0,-15 3.5,-4.8 14.2,-4.6 5.7,3.9 8.8,12.1 0,6 -8.8,12.1 -5.7,3.9 -14.2,-4.6 -3.5,-4.8" fill="#fbbf24"/>
  </g>
</svg>