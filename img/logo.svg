<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500">
  <defs>
    <!-- Vibrant Cyan & Electric Sky Blue Ocean Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="waveCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="waveDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="waveBright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="foamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>

    <!-- Drop Shadows for Crisp Depth -->
    <filter id="waveShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#032b45" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Emblem Ring with Waves Motif -->
  <g filter="url(#waveShadow)">
    <!-- Main Circle Shield Background -->
    <circle cx="300" cy="180" r="142" fill="url(#bgGrad)"/>
    <!-- Outer Cyan Accent Ring -->
    <circle cx="300" cy="180" r="135" fill="none" stroke="#ffffff" stroke-width="3.5" opacity="0.85"/>
    <circle cx="300" cy="180" r="126" fill="none" stroke="#00f2fe" stroke-width="2" stroke-dasharray="6 6" opacity="0.7"/>

    <!-- Wave Layer 1 (Deep Ocean Base Wave) -->
    <path d="M 162 205 C 205 135, 275 145, 315 195 C 355 245, 415 205, 438 175 C 415 260, 315 275, 255 240 C 205 210, 175 230, 162 205 Z" fill="url(#waveDeep)" opacity="0.95"/>

    <!-- Wave Layer 2 (Main Sculpted Cyan Ocean Wave Peak) -->
    <path d="M 165 215 C 215 125, 285 130, 325 185 C 365 235, 420 185, 435 150 C 410 240, 325 260, 265 220 C 215 185, 185 225, 165 215 Z" fill="url(#waveCyan)"/>

    <!-- Wave Layer 3 (Front Bright Wave Crest) -->
    <path d="M 180 230 C 235 160, 295 165, 335 210 C 375 250, 425 210, 430 180 C 405 245, 335 255, 280 225 C 230 195, 200 235, 180 230 Z" fill="url(#waveBright)"/>

    <!-- Wave Foam Splashes (Curved Highlights) -->
    <path d="M 215 145 C 240 120, 280 125, 305 150 C 285 132, 250 130, 225 148 Z" fill="url(#foamGrad)" opacity="0.95"/>
    <path d="M 325 185 C 350 155, 390 150, 415 165 C 390 155, 355 160, 335 180 Z" fill="url(#foamGrad)" opacity="0.85"/>
    <path d="M 175 210 Q 190 190 210 200" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>

    <!-- Integrated Wi-Fi Signal Waves Rising from Ocean Wave -->
    <g stroke="#ffffff" stroke-width="5.5" fill="none" stroke-linecap="round" filter="url(#glow)">
      <path d="M 225 110 A 90 90 0 0 1 375 110" />
      <path d="M 245 128 A 65 65 0 0 1 355 128" />
      <path d="M 265 146 A 40 40 0 0 1 335 146" />
      <circle cx="300" cy="162" r="5" fill="#ffffff" stroke="none"/>
    </g>

    <!-- Shimmer Droplets -->
    <circle cx="415" cy="115" r="4" fill="#ffffff"/>
    <circle cx="428" cy="132" r="2.5" fill="#00f2fe"/>
    <circle cx="185" cy="125" r="3.5" fill="#ffffff"/>
  </g>

  <!-- Network Title & Typography -->
  <g text-anchor="middle">
    <!-- Arabic Network Name -->
    <text x="300" y="375" font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-size="46" font-weight="900" fill="#032b45" letter-spacing="1">أمواج نت</text>
    
    <!-- English Subtitle -->
    <text x="300" y="415" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="800" fill="#0284c7" letter-spacing="7">AMWAG NET</text>
    
    <!-- Tagline Badge -->
    <rect x="175" y="435" width="250" height="32" rx="16" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
    <text x="300" y="456" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="800" fill="#0369a1">شبكة الاتصالات الفائقة ⚡</text>
  </g>
</svg>